[project]
name = "parsy"
description = "Easy-to-use parser combinators, for parsing in pure Python"
license = {text = "MIT"}
authors = [
  { name = "Jeanine Adkisson", email = "jneen@jneen.net" }
]
maintainers = [
  { name = "Luke Plant", email = "luke@lukeplant.me.uk" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Interpreters",
  "Topic :: Text Processing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
keywords = ["parser", "parsers", "parsing", "monad", "combinators"]
urls = {Homepage = "https://github.com/python-parsy/parsy"}

requires-python = ">=3.11"
dependencies = []

dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[tool.setuptools.dynamic]
version = {attr = "parsy.__version__"}

[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "tox-uv>=1.20.1",
    "tox>=4.24.1",
    "pytest-cov>=6.0.0",
    "pre-commit-uv>=4.1.4",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.0.2",
    "ruff>=0.17.4",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 119


[tool.ruff.lint]
extend-select = [
  "UP",  # pyupgrade
  "FLY", # flunt
  "I", # isort
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "B011", # Do not `assert False` (`python -O` removes these calls), raise `AssertionError()`
]
